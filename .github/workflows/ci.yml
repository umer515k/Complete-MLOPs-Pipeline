name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Train & Test Model
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r training/requirements.txt
          pip install fastapi uvicorn pydantic httpx pytest prometheus-fastapi-instrumentator==5.9.1

      - name: Train model
        run: python training/train.py

      - name: Run API tests
        run: pytest tests/ -v

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Train model
        run: |
          pip install -r training/requirements.txt
          python training/train.py

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mlops-pipeline:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mlops-pipeline:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > ~/.ssh/mlops-key
          chmod 600 ~/.ssh/mlops-key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/mlops-key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mlops-pipeline:latest &&
            docker stop mlops-app || true &&
            docker rm mlops-app || true &&
            docker run -d \
              -p 8000:8000 \
              --name mlops-app \
              --restart unless-stopped \
              ${{ secrets.DOCKERHUB_USERNAME }}/mlops-pipeline:latest &&
            docker image prune -f
          "
